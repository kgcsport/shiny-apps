<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Classroom Economy — Scheduled maintenance</title>
  <style>
    body{margin:0;background:#f7f3f0;color:#252525;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:600px;margin:12vh auto;padding:2.2rem;background:white;border:1px solid #e5ddd8;border-radius:14px;box-shadow:0 8px 30px #3b2a2014}
    h1{margin-top:0;color:#951829;font-size:1.65rem}
    p{color:#555}
    .note{margin-top:1.4rem;padding:.8rem 1rem;background:#fff8df;border-left:4px solid #951829;border-radius:6px}
  </style>
</head>
<body>
  <main>
    <h1>Classroom Economy is temporarily unavailable</h1>
    <p>The app is usually offline for scheduled maintenance between <strong>12:00 AM and 6:00 AM Eastern Time</strong>.</p>
    <p class="note">If you are seeing this outside those hours, please contact your professor.</p>
    <p>Please refresh in a few minutes.</p>
  </main>
</body>
</html>
