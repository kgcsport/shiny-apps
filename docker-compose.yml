services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    depends_on:
      shiny:
        condition: service_healthy
      demo-kit:
        condition: service_healthy

  shiny:
    image: ${SHINY_IMAGE:-ghcr.io/kgcsport/shiny-apps:latest}
    build: .
    restart: always
    volumes:
      # Optional: only needed if you want Google Drive backups/Sheets sync
      # via a credentials *file*. Simpler alternative: set
      # GOOGLE_SERVICE_ACCOUNT_JSON (the raw JSON content) in .env instead —
      # no file or mount required. Uncomment below if you specifically want
      # the file-based path and have google_application_credentials.json
      # in this directory:
      # - ./google_application_credentials.json:/run/secrets/gcp.json:ro
      - ./appdata:/srv/shiny-server/appdata
      - ./shiny-logs:/var/log/shiny-server
    env_file: .env
    environment:
      # Worker/session tuning presets. Pick one profile by setting these
      # variables in .env or uncommenting one block below, then restart.
      # Note: this Shiny Server build rejects app_session_timeout, so
      # SHINY_APP_SESSION_TIMEOUT is accepted by the entrypoint but omitted.
      #
      # Low memory:
      # SHINY_SIMPLE_SCHEDULER: "40"
      # SHINY_APP_IDLE_TIMEOUT: "60"
      # SHINY_APP_SESSION_TIMEOUT: "0"
      #
      # Balanced:
      SHINY_SIMPLE_SCHEDULER: ${SHINY_SIMPLE_SCHEDULER:-30}
      SHINY_APP_IDLE_TIMEOUT: ${SHINY_APP_IDLE_TIMEOUT:-60}
      SHINY_APP_SESSION_TIMEOUT: ${SHINY_APP_SESSION_TIMEOUT:-0}
      #
      # Responsiveness:
      # SHINY_SIMPLE_SCHEDULER: "15"
      # SHINY_APP_IDLE_TIMEOUT: "30"
      # SHINY_APP_SESSION_TIMEOUT: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/shiny-server/ext/node/bin/node -e \"require('http').get('http://127.0.0.1:3838/',r=>process.exit(r.statusCode < 500 ? 0 : 1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  # Demo / sandbox instance — identical image, separate DB files (*-demo.sqlite).
  # Quick-login panel is always visible (no ?demo=1 needed).
  # Seed:  ./scripts/rtest.sh seed-demo
  # Reset: ./scripts/rtest.sh reset-demo
  shiny-demo:
    image: ${SHINY_IMAGE:-ghcr.io/kgcsport/shiny-apps:latest}
    build: .
    restart: always
    ports:
      - "${DEMO_PORT:-8080}:3838"
    volumes:
      - ./appdata:/srv/shiny-server/appdata
      - ./shiny-logs:/var/log/shiny-server
    env_file: .env
    environment:
      DEMO_MODE: "1"
      SHINY_SIMPLE_SCHEDULER: "10"
      SHINY_APP_IDLE_TIMEOUT: "120"
      SHINY_APP_SESSION_TIMEOUT: "0"

  # Classroom Game Builder — Node.js app with Google OAuth, Anthropic proxy, WebSocket multiplayer.
  # Access at http://yourserver:3000  (or put behind nginx on a subdomain).
  # Required .env vars: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
  #                     DEMO_KIT_BASE_URL (e.g. https://gamebuilder.kylecoombs.com)
  # Optional:           DEMO_KIT_DAILY_LIMIT (default 25), DEMO_KIT_EDU_ONLY (default true)
  # Note: Anthropic API key is entered by each user in the UI — not stored on server.
  demo-kit:
    # Set DEMO_KIT_IMAGE to an immutable published tag in the production .env.
    image: ${DEMO_KIT_IMAGE:-ghcr.io/kgcsport/demo-kit:latest}
    build: ./apps/demo-kit-site
    restart: always
    ports:
      - "${DEMO_KIT_PORT:-3000}:3000"
    volumes:
      - ./appdata/data:/app/data
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      DB_PATH: /app/data/demo_kit.sqlite
      BASE_URL: ${DEMO_KIT_BASE_URL:-http://localhost:3000}
      ANTHROPIC_MODEL: ${DEMO_KIT_MODEL:-claude-sonnet-5}
      DEMO_KIT_DAILY_LIMIT: ${DEMO_KIT_DAILY_LIMIT:-25}
      DEMO_KIT_EDU_ONLY: ${DEMO_KIT_EDU_ONLY:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_KIT_AUTH_DISABLED: ${DEMO_KIT_AUTH_DISABLED:-false}
      DEMO_KIT_DEMO_USER: ${DEMO_KIT_DEMO_USER:-}
      DEMO_KIT_DEMO_PASS: ${DEMO_KIT_DEMO_PASS:-}
      DEMO_KIT_OPENAI_KEY: ${DEMO_KIT_OPENAI_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-6-sol}
      OPENAI_DEMO_MODEL: ${OPENAI_DEMO_MODEL:-gpt-6-luna}
      OPENAI_ESCALATION_MODEL: ${OPENAI_ESCALATION_MODEL:-gpt-6-astra}
      SHINY_BASE_URL: ${SHINY_BASE_URL:-}
      SHINY_DB_PATH: /app/data/class-job-market.sqlite
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.statusCode < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
