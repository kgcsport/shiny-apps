<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory of the Firm — Preview</title><link rel="stylesheet" href="/styles.css"></head><body><main class="app"><header><p class="eyebrow">Lightweight preview</p><h1>Theory of the Firm</h1><p>Adjust linear demand and a cubic marginal-cost curve to see profit-maximizing output.</p></header><section class="layout firm-layout"><aside class="panel controls-panel"><fieldset><legend>Demand: P(Q) = A − BQ</legend><div class="control"><label>A <output id="A-v"></output></label><input id="A" type="range" min="10" max="200" value="80"></div><div class="control"><label>B <output id="B-v"></output></label><input id="B" type="range" min=".1" max="10" step=".1" value="2"></div></fieldset><fieldset><legend>Costs: MC(Q) = a + bQ + cQ² + dQ³</legend><div class="two-controls"><div class="control"><label>Fixed F<input id="F" type="number" value="0"></label></div><div class="control"><label>a<input id="a" type="number" value="40"></label></div><div class="control"><label>b<input id="b" type="number" value="-2" step=".1"></label></div><div class="control"><label>c<input id="c" type="number" value=".02" step=".01"></label></div><div class="control"><label>d<input id="d" type="number" value=".0005" step=".0001"></label></div></div></fieldset><fieldset><legend>Graph</legend><div class="two-controls"><div class="control"><label>Q max<input id="qMax" type="number" value="100" min="1"></label></div><div class="control"><label>Y max<input id="yMax" type="number" value="100" min="1"></label></div></div><label class="checkbox"><input id="atc" type="checkbox" checked> Show ATC</label></fieldset><button class="button" id="download">Download solution (CSV)</button><p id="status" class="status error"></p></aside><section class="consumer-main"><section class="panel chart-panel"><h2>Demand, MR, and costs</h2><svg id="chart" class="chart consumer-chart" viewBox="0 0 720 440" role="img" aria-label="Demand, marginal revenue, marginal cost, and average total cost curves"></svg></section><section class="panel chart-panel"><h2>Revenue and total cost at Q*</h2><svg id="boxes" class="chart consumer-chart" viewBox="0 0 720 330" role="img" aria-label="Revenue and total cost rectangles at optimal output"></svg></section><div id="summary" class="summary panel" aria-live="polite"></div></section></section></main><script type="module" src="/modules/theory-of-firm-page.js"></script></body></html>
