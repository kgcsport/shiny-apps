<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tax Incidence Explorer — Preview</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app"><header><p class="eyebrow">Lightweight preview</p><h1>Tax Incidence Explorer</h1><p>Adjust slopes and the per-unit tax. No-tax equilibrium remains Q*=6 and P*=$8.</p></header><section class="layout"><aside class="panel"><div class="control"><label for="demand">Demand slope <output id="demand-value">1.0</output></label><input id="demand" type="range" min="0.1" max="5" step="0.1" value="1"></div><div class="control"><label for="supply">Supply slope <output id="supply-value">1.0</output></label><input id="supply" type="range" min="0.1" max="5" step="0.1" value="1"></div><div class="control"><label for="tax">Tax per unit <output id="tax-value">$4.0</output></label><input id="tax" type="range" min="0" max="10" step="0.5" value="4"></div><div class="results" id="results" aria-live="polite"></div><div class="button-row"><button class="button" id="download">Download current values (CSV)</button></div></aside><section class="panel chart-panel"><svg id="chart" class="chart" viewBox="0 0 720 500" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Tax incidence supply and demand diagram</title><desc id="chart-description">Interactive supply, demand, tax wedge, revenue, and deadweight-loss diagram.</desc></svg></section></section></main>
<script type="module">
import {calculateTaxIncidence,taxIncidenceCsv} from "/modules/tax-incidence.js";const $=id=>document.getElementById(id),s=$("chart"),N="http://www.w3.org/2000/svg",D={w:720,h:500,l:76,r:26,t:26,b:66,q:12,p:24},x=q=>D.l+q/D.q*(D.w-D.l-D.r),y=p=>D.t+(1-p/D.p)*(D.h-D.t-D.b),money=n=>`$${n.toFixed(2)}`;const add=(tag,a={},text="")=>{const e=document.createElementNS(N,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));e.textContent=text;s.append(e)},read=()=>({demandSlope:+$("demand").value,supplySlope:+$("supply").value,tax:+$("tax").value});function path(f,lo,hi){return Array.from({length:121},(_,i)=>{const q=lo+(hi-lo)*i/120;return`${i?"L":"M"}${x(q)} ${y(f(q))}`}).join(" ")}function render(){const v=calculateTaxIncidence(read());$("demand-value").value=v.b.toFixed(1);$("supply-value").value=v.d.toFixed(1);$("tax-value").value=`$${v.tax.toFixed(1)}`;s.replaceChildren();for(let q=0;q<=12;q+=2){add("line",{x1:x(q),y1:y(0),x2:x(q),y2:y(24),class:"grid"});add("text",{x:x(q),y:y(0)+22,class:"label","text-anchor":"middle"},q)}for(let p=0;p<=24;p+=4){add("line",{x1:x(0),y1:y(p),x2:x(12),y2:y(p),class:"grid"});add("text",{x:x(0)-10,y:y(p)+4,class:"label","text-anchor":"end"},p)}if(v.tax&&v.qTax){add("polygon",{points:`${x(0)},${y(v.buyerPrice)} ${x(0)},${y(v.sellerPrice)} ${x(v.qTax)},${y(v.sellerPrice)} ${x(v.qTax)},${y(v.buyerPrice)}`,fill:"#e5b84b",opacity:".55"});if(v.qTax<v.qStar)add("polygon",{points:`${x(v.qTax)},${y(v.sellerPrice)} ${x(v.qTax)},${y(v.buyerPrice)} ${x(v.qStar)},${y(v.pStar)}`,fill:"#b5445b",opacity:".62"});add("line",{x1:x(0),y1:y(v.buyerPrice),x2:x(v.qTax),y2:y(v.buyerPrice),class:"tax"});add("line",{x1:x(0),y1:y(v.sellerPrice),x2:x(v.qTax),y2:y(v.sellerPrice),class:"tax"})}add("path",{d:path(q=>v.a-v.b*q,0,Math.min(12,v.a/v.b)),fill:"none",class:"demand","stroke-width":"3"});add("path",{d:path(q=>v.c+v.d*q,Math.max(0,-v.c/v.d),12),fill:"none",class:"supply","stroke-width":"3"});add("line",{x1:x(0),y1:y(8),x2:x(6),y2:y(8),class:"reference"});add("line",{x1:x(6),y1:y(0),x2:x(6),y2:y(8),class:"reference"});add("line",{x1:x(0),y1:y(0),x2:x(12),y2:y(0),class:"axis","stroke-width":"2"});add("line",{x1:x(0),y1:y(0),x2:x(0),y2:y(24),class:"axis","stroke-width":"2"});add("text",{x:x(6),y:D.h-16,class:"label","text-anchor":"middle"},"Quantity");const rows=[["No-tax equilibrium","Q* = 6.00, P* = $8.00"],["After tax",`Q = ${v.qTax.toFixed(2)}`],["Buyer price",`${money(v.buyerPrice)} (+${money(v.buyerBurden)})","buyer"],["Seller price",`${money(v.sellerPrice)} (-${money(v.sellerBurden)})","seller"],["Buyer burden",`${(v.buyerShare*100).toFixed(0)}%`,`buyer`],["Seller burden",`${(v.sellerShare*100).toFixed(0)}%`,`seller`],["Tax revenue",money(v.revenue)],["Deadweight loss",money(v.deadweightLoss),"danger"]];$("results").replaceChildren(Object.assign(document.createElement("h2"),{textContent:"Results"}),...rows.map(([a,b,c=""])=>{const r=document.createElement("div");r.className="result-row";const k=document.createElement("span"),z=document.createElement("strong");k.textContent=a;z.className=c;z.textContent=b;r.append(k,z);return r}))}function download(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([taxIncidenceCsv(read())],{type:"text/csv"}));a.download="tax-incidence-current-values.csv";a.click();URL.revokeObjectURL(a.href)}["demand","supply","tax"].forEach(id=>$(id).addEventListener("input",render));$("download").onclick=download;render();
</script></body></html>
