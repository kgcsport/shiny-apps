<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Airplane Production Experiment — Preview</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app"><header><p class="eyebrow">Lightweight preview</p><h1>Airplane Production Experiment</h1><p>Enter teams’ workers and planes. Data stays in this browser and can be exported as CSV.</p></header><section class="layout"><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Firm</th><th>Workers</th><th>Planes</th><th><span class="visually-hidden">Remove</span></th></tr></thead><tbody id="rows"></tbody></table></div><div class="button-row"><button id="add" class="button primary">Add row</button><button id="advance" class="button">Advance round</button><button id="reset" class="button">Reset</button><button id="download" class="button">Download CSV</button></div><p id="round" class="status"></p><p id="status" class="status" role="status"></p></section><section class="panel chart-panel"><svg id="chart" class="chart" viewBox="0 0 720 500" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Airplane production scatter plot</title><desc id="chart-description">Plots workers against planes produced for each completed row.</desc></svg></section></section></main>
<script type="module">
import {INITIAL_ROWS,advanceRound,airplanesCsv,chartPoints,normalizeExperimentState,normalizeRows} from "/modules/airplanes-game.js";const $=id=>document.getElementById(id),key="lightweight-airplanes-game-v1",colors=["#1769aa","#a21c34","#19723b","#8a4dad","#bd6d16","#087a91"];let state=restore(),rows=state.rows;function restore(){try{return normalizeExperimentState(JSON.parse(localStorage.getItem(key)))}catch{return normalizeExperimentState({rows:INITIAL_ROWS})}}function save(m="Saved on this browser."){state.rows=rows;localStorage.setItem(key,JSON.stringify(state));$("round").textContent=`Round ${state.round} · ${state.history.length} completed`;$("status").textContent=m}function update(i,p){rows[i]=normalizeRows([{...rows[i],...p}])[0];render()}function cell(type,value,label,fn){const e=document.createElement("input");e.type=type;e.value=value;e.setAttribute("aria-label",label);if(type==="number"){e.min="0";e.step="1"}e.oninput=()=>fn(e.value);return e}function table(){const b=$("rows");b.replaceChildren(...rows.map((r,i)=>{const tr=document.createElement("tr"),f=document.createElement("td"),w=document.createElement("td"),o=document.createElement("td"),d=document.createElement("td");f.append(cell("text",r.firm,`Firm ${i+1}`,v=>update(i,{firm:v})));w.append(cell("number",r.workers,`Workers ${i+1}`,v=>update(i,{workers:v})));const out=cell("number",r.output,`Planes ${i+1}`,v=>update(i,{output:v}));out.placeholder="Enter output";o.append(out);const del=document.createElement("button");del.className="icon-button";del.textContent="×";del.title="Remove row";del.disabled=rows.length===1;del.onclick=()=>{rows.splice(i,1);render("Row removed.")};d.append(del);tr.append(f,w,o,d);return tr}))}function chart(){const s=$("chart"),p=chartPoints(rows),N="http://www.w3.org/2000/svg",D={w:720,h:500,l:78,r:28,t:26,b:64},mw=Math.max(4,...p.map(x=>x.workers)),mo=Math.max(4,...p.map(x=>x.output)),xm=Math.ceil(mw*1.2),ym=Math.ceil(mo*1.2),x=v=>D.l+v/xm*(D.w-D.l-D.r),y=v=>D.t+(1-v/ym)*(D.h-D.t-D.b);s.replaceChildren();const a=(t,q,z="")=>{const e=document.createElementNS(N,t);Object.entries(q).forEach(([k,v])=>e.setAttribute(k,v));e.textContent=z;s.append(e)};for(let i=0;i<=5;i++){const xv=xm*i/5,yv=ym*i/5;a("line",{x1:x(xv),y1:y(0),x2:x(xv),y2:y(ym),class:"grid"});a("line",{x1:x(0),y1:y(yv),x2:x(xm),y2:y(yv),class:"grid"});a("text",{x:x(xv),y:y(0)+22,class:"label","text-anchor":"middle"},xv.toFixed(1));a("text",{x:x(0)-10,y:y(yv)+4,class:"label","text-anchor":"end"},yv.toFixed(1))}a("line",{x1:x(0),y1:y(0),x2:x(xm),y2:y(0),class:"axis","stroke-width":"2"});a("line",{x1:x(0),y1:y(0),x2:x(0),y2:y(ym),class:"axis","stroke-width":"2"});if(!p.length){a("text",{x:x(xm/2),y:y(ym/2),class:"label","text-anchor":"middle"},"Enter output values to see the chart.");return}p.forEach((v,i)=>{const c=colors[i%colors.length];a("circle",{cx:x(v.workers),cy:y(v.output),r:"8",fill:c,stroke:"#fff","stroke-width":"2"});a("text",{x:x(v.workers)+12,y:y(v.output)-7,fill:c,"font-size":"13","font-weight":"800"},v.firm)})}function render(m){table();chart();save(m)}function download(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([airplanesCsv(rows)],{type:"text/csv"}));a.download=`airplane-production-round-${state.round}.csv`;a.click();URL.revokeObjectURL(a.href);$("status").textContent="Downloaded CSV."}$("add").onclick=()=>{rows.push(normalizeRows([{firm:String.fromCharCode(65+rows.length%26),workers:1,output:""}])[0]);render("Added a row.")};$("advance").onclick=()=>{state=advanceRound({...state,rows});rows=state.rows;render(`Saved round ${state.round-1}; ready for round ${state.round}.`)};$("reset").onclick=()=>{state={round:1,history:[],rows:normalizeRows(INITIAL_ROWS)};rows=state.rows;render("Reset all rounds.")};$("download").onclick=download;render("Ready. Data is stored only in this browser.");
</script></body></html>
