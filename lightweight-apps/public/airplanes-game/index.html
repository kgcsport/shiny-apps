<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airplane Production Experiment — Preview</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header><p class="eyebrow">Lightweight preview</p><h1>Airplane Production Experiment</h1><p>Each round stays on the chart. Enter the next round below without losing earlier results.</p></header>
    <section class="airplanes-layout">
      <section class="panel chart-panel">
        <svg id="chart" class="chart" viewBox="0 0 720 500" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Airplane production scatter plot</title><desc id="chart-description">Plots workers against planes produced for current and completed rounds.</desc></svg>
      </section>
      <section class="panel entry-panel">
        <div class="entry-header"><div><h2>Round entry</h2><p id="round" class="status"></p></div><p id="status" class="status" role="status"></p></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Firm</th><th>Workers</th><th>Planes</th><th><span class="visually-hidden">Remove</span></th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="button-row"><button id="add" class="button primary" type="button">Add row</button><button id="advance" class="button" type="button">Advance round</button><button id="reset" class="button" type="button">Reset all rounds</button><button id="download" class="button" type="button">Download all rounds (CSV)</button></div>
      </section>
    </section>
  </main>
  <script type="module">import { startAirplanesExperiment } from "/modules/airplanes-page.js"; startAirplanesExperiment();</script>
</body>
</html>
