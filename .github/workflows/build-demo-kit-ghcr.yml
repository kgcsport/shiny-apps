name: Build demo-kit image

on:
  push:
    branches: [ main ]
    paths:
      - "apps/demo-kit-site/**"
      - ".github/workflows/build-demo-kit-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push demo-kit image
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-kit-site
          push: true
          tags: |
            ghcr.io/kgcsport/demo-kit:latest
            ghcr.io/kgcsport/demo-kit:${{ github.sha }}
