server {
    listen 80;
    server_name shiny.kylecoombs.com;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $demo_kit_upstream demo-kit:3000;
    # Keep normal Shiny pages and slide embeds working while reducing browser exposure.
    client_max_body_size 5m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Give users a useful message when the Shiny upstream is restarting or unavailable.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        default_type text/html;
        # A transient 502 during scheduled startup must never be cached by
        # the browser or an intermediary; otherwise users need a cache-busting
        # query string before the recovered app becomes visible.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # OAuth flow handled by demo-kit (fast Node.js) — appears as shiny domain to browser
    location = /auth/login {
        proxy_pass         http://$demo_kit_upstream/shiny-auth/login$is_args$args;
        proxy_intercept_errors on;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }
    location = /auth/callback {
        proxy_pass         http://$demo_kit_upstream/shiny-auth/callback$is_args$args;
        proxy_intercept_errors on;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }
    location = /auth/demo-login {
        proxy_pass         http://$demo_kit_upstream/shiny-auth/demo-login;
        proxy_intercept_errors on;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass         http://shiny:3838;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
}

