server {
    listen 80;
    server_name shiny.kylecoombs.com;

    # Give users a useful message when the Shiny upstream is restarting or unavailable.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        default_type text/html;
        # A transient 502 during scheduled startup must never be cached by
        # the browser or an intermediary; otherwise users need a cache-busting
        # query string before the recovered app becomes visible.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # OAuth flow handled by demo-kit (fast Node.js) — appears as shiny domain to browser
    location = /auth/login {
        proxy_pass         http://demo-kit:3000/shiny-auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /auth/callback {
        proxy_pass         http://demo-kit:3000/shiny-auth/callback;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /auth/demo-login {
        proxy_pass         http://demo-kit:3000/shiny-auth/demo-login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass         http://shiny:3838;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name gamebuilder.kylecoombs.com;

    location / {
        proxy_pass         http://demo-kit:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
